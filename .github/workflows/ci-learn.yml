name: CI Learning

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake --version
          cmake -S ci-learn -B ci-learn/build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build ci-learn/build --config Release --verbose

      - name: Run
        run: .\ci-learn\build\Release\ci_hello.exe
