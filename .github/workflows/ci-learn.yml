name: My first C++ CI

on: 
  push:
    branches:
      - ci-learning
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake --version
          cmake -S ci-learn -B ci-learn/build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build ci-learn/build --config Release --verbose

      - name: Test
        run:  ctest --test-dir ci-learn/build -C Release --output-on-failure --no-tests=error
        
      - name: Run
        run: .\ci-learn\build\Release\ci_hello.exe

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ci-hello-windows-x64
          path: .\ci-learn\build\Release\ci_hello.exe
          retention-days: 7
          if-no-files-found: error
  verify:
    needs: build
    runs-on: windows-2022
    steps:
      - name: Download executable
        uses: actions/download-artifact@v7
        with:
          name: ci-hello-windows-x64
          path: downloaded

      - name: Run downlaoded executable
        run: .\downloaded\ci_hello.exe


