name: Qt Learning

on:
  push:
    branches:
      - ci-learning

permissions:
  contents: read

jobs:
  qt_build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.12.5'
          arch: 'win64_msvc2017_64'
          cache: 'true'

      - name: Restore OCCT cache
        id: occt_cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.3
          key: ${{ runner.os }}-${{ runner.arch }}-occt-7.9.3-combined-afbef345-v1

      - name: Install OCCT
        if: steps.occt_cache.outputs.cache-hit != 'true'
        run: |
          $zipFile = Join-Path $env:RUNNER_TEMP "occt.zip"
          $packageRoot = Join-Path $env:RUNNER_TEMP "occt-7.9.3"

          Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/opencascade-7.9.3-vc14-64-combined.zip" -OutFile $zipFile

          $expectedHash = "afbef3457fbc4a2bdca0608e0fe284392f51e4c2c42ccbfb9df7168d8e4eb9b3"
          if ((Get-FileHash $zipFile -Algorithm SHA256).Hash -ne $expectedHash) {
              throw "OCCT archive checksum mismatch"
          }

          Expand-Archive -Path $zipFile -DestinationPath $packageRoot

      - name: Set up OCCT environment
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "occt-7.9.3"
          $occtRoot = Join-Path $packageRoot "opencascade-7.9.3-vc14-64"

          "OCCT_ROOT=$occtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @(
              "$occtRoot/win64/vc14/bin"
              "$packageRoot/3rdparty-vc14-64/tbb-2021.13.0-x64/bin"
              "$packageRoot/3rdparty-vc14-64/jemalloc-vc14-64/bin"
          ) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake -S qt-occt-learn -B qt-occt-learn/build-ci -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DOpenCASCADE_DIR=$env:OCCT_ROOT/cmake"

      - name: Build
        run: cmake --build qt-occt-learn/build-ci --config Release

      - name: GUI smoke test
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\qt-occt-learn\build-ci\Release\qt_hello.exe --smoke-test
        
      - name: Prepare deployment
        run: |
          $deployDir = Join-Path $env:GITHUB_WORKSPACE "qt-occt-learn/dist-ci"
          $packageRoot = Join-Path $env:RUNNER_TEMP "occt-7.9.3"

          New-Item -ItemType Directory -Path $deployDir -Force | Out-Null
          Copy-Item "qt-occt-learn/build-ci/Release/qt_hello.exe" $deployDir

          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime "$deployDir/qt_hello.exe"
          if ($LASTEXITCODE -ne 0) {
              throw "windeployqt failed"
          }

          $runtimeFiles = @(
              "$env:OCCT_ROOT/win64/vc14/bin/TKMath.dll"
              "$env:OCCT_ROOT/win64/vc14/bin/TKernel.dll"
              "$packageRoot/3rdparty-vc14-64/tbb-2021.13.0-x64/bin/tbb12.dll"
              "$packageRoot/3rdparty-vc14-64/jemalloc-vc14-64/bin/jemalloc.dll"
          )
          Copy-Item -LiteralPath $runtimeFiles -Destination $deployDir

          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" "$deployDir/platforms/"

          @(
              "Qt + OCCT learning demo"
              "Requires Windows x64 and a compatible Microsoft Visual C++ v14 x64 Redistributable."
              "Run: qt_hello.exe"
              "Smoke check: qt_hello.exe --smoke-test"
          ) | Set-Content -Path "$deployDir/README.txt" -Encoding utf8

      - name: Upload deployment
        uses: actions/upload-artifact@v7
        with:
          name: qt-occt-demo-windows-x64
          path: qt-occt-learn/dist-ci/
          retention-days: 7
          if-no-files-found: error